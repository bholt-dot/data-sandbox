# Natural satellites. Elements are relative to the parent planet, epoch J2000, but expressed in
# the same J2000 ecliptic axes as the heliocentric orbits (the game uses one set of axes at every
# level), so a moon's i/node place it in its planet's (tilted) equatorial plane: ~2 deg for
# Jupiter, ~26 deg for Mars, ~28 deg for Saturn, ~98 deg for Uranus.
#
# How the elements were made (derivation described in bean repo-pl7w):
#   * a: published mean semi-major axes (JPL SSD "Planetary Satellite Mean Elements"; Enceladus,
#     Rhea, Titan from the IAU/Wikipedia infobox values). Kepler periods with the parent GM from
#     bodies.toml match the known sidereal periods to <0.1% (Luna: 0.5%, see below).
#   * i, node, peri, M, e: an analytic theory sampled over one orbit starting at J2000 and fitted
#     with a plane + first-order ellipse; M is chosen so the J2000 direction is reproduced.
#       Galilean moons: astronomy-engine 2.1.19 (Lieske E5 series), geometric J2000 vectors.
#       Mars moons, Saturn and Uranus moons: PyEphem 4.2.1 / libastro (TASS 1.7 for Saturn,
#       GUST86 for Uranus), corrected for light time. PyEphem and astronomy-engine agree on the
#       Galilean moons to 0.2 deg in mean longitude.
#     Fitted e agrees with JPL's mean e to ~0.001.
# Approximations: fixed ellipses with no nodal/apsidal precession (inner moons' nodes regress
# around their planet's equator in years to centuries, so by 2350 the phase and node are
# effectively fictional -- the orbit size, plane and period are what matter); Luna uses Earth-only
# GM, making its period 0.5% long; Phoebe is an osculating (not mean) orbit.
#
# GM: JPL SSD satellite physical parameters (Luna: DE440; Mars: MAR097; Jupiter: JUP310;
# Saturn: SAT441). Uranian moon GM from published masses (approximate, +-3%). Radii: mean radii
# from the same tables.

# ---- Earth ------------------------------------------------------------------------------------

# Luna: JPL mean ecliptic elements at J2000. Within 0.6 deg of the true J2000 position.
[body.luna]
name = "Luna"
kind = "moon"
parent = "earth"
gm_km3_s2 = 4902.8
radius_km = 1737
color = "#a8a6a2"
orbit = { a_km = 384400, e = 0.0549, i_deg = 5.145, node_deg = 125.08, peri_deg = 318.15, mean_anomaly_deg = 135.27 }

