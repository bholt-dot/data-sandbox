# Phoebe: irregular, retrograde. JPL Horizons osculating elements (epoch 2026-05-12, as shipped
# in Stellarium's ssystem_major.ini; Saturn-equator frame -- the only reading that gives Phoebe's
# known near-ecliptic retrograde orbit) rotated to ecliptic axes (IAU 2015 Saturn pole) and
# propagated back to J2000 with their own mean motion. Solar perturbations make the J2000 phase
# uncertain by tens of degrees; size, shape and the ~173 deg ecliptic inclination are right.
[body.phoebe]
name = "Phoebe"
kind = "moon"
parent = "saturn"
gm_km3_s2 = 0.5532
radius_km = 106.5
orbit = { a_km = 12937594, e = 0.1771, i_deg = 172.83, node_deg = 271.02, peri_deg = 10.15, mean_anomaly_deg = 41.55 }

