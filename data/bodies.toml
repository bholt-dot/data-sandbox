# The Sun and the planets. Moons are in moons.toml, small bodies in asteroids.toml.
#
# All orbits are fixed Keplerian ellipses at epoch J2000, in J2000 mean ecliptic & equinox axes.
# There are no element rates, so positions drift from reality over the centuries to 2350 (a few
# degrees of orbital longitude for the outer planets); it is the right sky, not an ephemeris.
#
# Planet elements: E. M. Standish, "Keplerian Elements for Approximate Positions of the Major
# Planets" (JPL SSD), Table 1 (1800-2050 AD), converted as peri = varpi - node, M = L - varpi.
# Earth's row is the Earth-Moon barycentre. Cross-checked against VSOP87 (astronomy-engine 2.1)
# at J2000: every planet within 0.15 deg of heliocentric longitude.
#
# GM: JPL SSD planetary physical parameters / DE440. Planets that host moons use the planet-only GM
# (not the system GM) so moon orbits come out right. Radii are IAU mean radii (Archinal et al.
# 2018). The game uses only the parent's GM for an orbit, so planetary periods are 0.001-0.06%
# off the true sidereal periods.

[body.sun]
name = "Sol"
kind = "star"
gm_km3_s2 = 1.32712440018e11
radius_km = 695700

