# [A]; M_J2000 = 340.580 ([B] gives 338.808)
orbit = { a_au = 2.3619563, e = 0.0893657, i_deg = 7.13380, node_deg = 103.91841, peri_deg = 150.18003, mean_anomaly_deg = 340.580 }

