# Near-Earth (Amor) asteroid, 1.13-1.78 AU. Close approaches to Earth and Mars make the
# 26-year back-propagation of its phase the least certain of the set (several degrees).
[body.eros]
name = "Eros"
kind = "asteroid"
parent = "sun"
gm_km3_s2 = 0.0004463
radius_km = 8.42
# [B], n = 0.5597753 deg/day
orbit = { a_au = 1.458121, e = 0.222836, i_deg = 10.82847, node_deg = 304.27008, peri_deg = 178.92978, mean_anomaly_deg = 57.599 }
