kind = "asteroid"
parent = "sun"
gm_km3_s2 = 1.8
radius_km = 127
# [A]; M_J2000 = 240.604 ([B] gives 242.545)
orbit = { a_au = 2.6678842, e = 0.2580231, i_deg = 12.97036, node_deg = 170.12007, peri_deg = 247.84192, mean_anomaly_deg = 240.604 }

