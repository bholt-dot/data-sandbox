# Outer-planet stations. Ganymede's domes feed the outer system; the icy moons sell water;
# everything out here imports medical supplies and parts.

[station.ganymede_agridomes]
name = "Ganymede Agridomes"
body = "ganymede"
faction = "earth"
population = 1100000
docking_fee = 180
market = [
  { commodity = "food", production = 420, consumption = 90, stock = 20000 },
  { commodity = "water", production = 200, consumption = 180, stock = 10000 },
  { commodity = "oxygen", production = 40, consumption = 30, stock = 2000 },
  { commodity = "metals", consumption = 20, stock = 800 },
